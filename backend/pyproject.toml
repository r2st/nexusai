[project]
name = "nexusai"
version = "1.0.0"
description = "Modern AI-powered chat and analytics platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "NexusAI Contributors", email = "team@nexusai.dev" }
]
keywords = ["ai", "chat", "analytics", "fastapi", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web Framework
    "fastapi>=0.115.14",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.10.0",
    "passlib[bcrypt]>=1.7.4",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.20.0",
    "pgvector>=0.3.5",

    # Redis & Caching
    "redis>=5.2.0",
    "hiredis>=3.0.0",

    # AI/ML
    "langchain>=0.3.15",
    "nemoguardrails>=0.11.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.8",
    "langchain-google-genai>=2.0.4",
    "langchain-community>=0.3.15",
    "langchain-text-splitters>=0.3.6",
    "openai>=1.59.0,<2.0.0",
    "anthropic>=0.102.0,<1.0.0",
    "tiktoken>=0.14.0",
    "sentence-transformers>=3.4.0",

    # Document Processing
    "pypdf>=5.4.0",
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "unstructured>=0.16.0",
    "beautifulsoup4>=4.12.3",

    # Utilities
    "pydantic[email]>=2.14.0",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.1.0",
    "structlog>=26.0.0",
    "tenacity>=9.0.0",
    "orjson>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "faker>=33.0.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "-ra",
    "--tb=short",
    # Disable warning output to suppress LangChainDeprecationWarning from langgraph.
    # This third-party warning cannot be filtered via standard mechanisms.
    "-p", "no:warnings",
]
markers = [
    "unit: mark test as unit test",
    "integration: mark test as integration test",
    "slow: mark test as slow running",
    "auth: mark test as authentication related",
    "chat: mark test as chat related",
    "api: mark test as API related",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
    # Suppress SQLAlchemy/asyncpg connection cleanup warnings in tests
    "ignore:coroutine 'Connection._cancel' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2
