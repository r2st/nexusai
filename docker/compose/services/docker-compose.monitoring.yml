# Monitoring stack for NexusAI
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # =============================================================================
  # Prometheus - Metrics Collection
  # =============================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: nexusai-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nexusai-internal
      - nexusai-monitoring
    expose:
      - "9090"
    labels:
      traefik.enable: "true"
      traefik.http.routers.prometheus.rule: "Host(`prometheus.${DOMAIN:-localhost}`)"
      traefik.http.routers.prometheus.tls.certresolver: "letsencrypt"
      traefik.http.routers.prometheus.middlewares: "auth@file"
      traefik.http.services.prometheus.loadbalancer.server.port: "9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  # =============================================================================
  # Grafana - Visualization & Dashboards
  # =============================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: nexusai-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "472:472"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:-localhost}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
      - GF_FEATURE_TOGGLES_ENABLE=publicDashboards
      - GF_LOG_LEVEL=warn
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nexusai-internal
      - nexusai-monitoring
    expose:
      - "3000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: "Host(`grafana.${DOMAIN:-localhost}`)"
      traefik.http.routers.grafana.tls.certresolver: "letsencrypt"
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging

  # =============================================================================
  # Loki - Log Aggregation
  # =============================================================================
  loki:
    image: grafana/loki:2.9.2
    container_name: nexusai-loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./deploy/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - nexusai-monitoring
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging

  # =============================================================================
  # Promtail - Log Collector
  # =============================================================================
  promtail:
    image: grafana/promtail:2.9.2
    container_name: nexusai-promtail
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./deploy/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - nexusai-monitoring
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  # =============================================================================
  # Node Exporter - Host Metrics
  # =============================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: nexusai-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - nexusai-monitoring
    expose:
      - "9100"
    pid: host
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging: *default-logging

  # =============================================================================
  # Redis Exporter
  # =============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: nexusai-redis-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - nexusai-internal
      - nexusai-monitoring
    expose:
      - "9121"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
        reservations:
          cpus: "0.02"
          memory: 16M
    logging: *default-logging

  # =============================================================================
  # PostgreSQL Exporter
  # =============================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: nexusai-postgres-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DATA_SOURCE_URI=postgres:5432/${POSTGRES_DB:-nexusai}?sslmode=disable
      - DATA_SOURCE_USER=${POSTGRES_USER:-nexusai}
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD}
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yml
    volumes:
      - ./deploy/postgres-exporter/queries.yml:/etc/postgres_exporter/queries.yml:ro
    networks:
      - nexusai-internal
      - nexusai-monitoring
    expose:
      - "9187"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
        reservations:
          cpus: "0.02"
          memory: 16M
    logging: *default-logging

  # =============================================================================
  # cAdvisor - Container Metrics
  # =============================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: nexusai-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - nexusai-monitoring
    expose:
      - "8080"
    labels:
      traefik.enable: "false"  # Internal only
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging

  # =============================================================================
  # Jaeger - Distributed Tracing
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: nexusai-jaeger
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    networks:
      - nexusai-internal
      - nexusai-monitoring
    ports:
      - "16686:16686"  # UI
    expose:
      - "4317"   # OTLP gRPC
      - "4318"   # OTLP HTTP
      - "14268"  # Jaeger HTTP
    labels:
      traefik.enable: "true"
      traefik.http.routers.jaeger.rule: "Host(`jaeger.${DOMAIN:-localhost}`)"
      traefik.http.routers.jaeger.tls.certresolver: "letsencrypt"
      traefik.http.routers.jaeger.middlewares: "auth@file"
      traefik.http.services.jaeger.loadbalancer.server.port: "16686"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging

  # =============================================================================
  # Langfuse - LLM Observability
  # =============================================================================
  langfuse:
    image: langfuse/langfuse:2
    container_name: nexusai-langfuse
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nexusai}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB:-langfuse}
      - NEXTAUTH_URL=http://langfuse.${DOMAIN:-localhost}
      - NEXTAUTH_SECRET=${LANGFUSE_SECRET:-changeme-langfuse-secret-32chars}
      - SALT=${LANGFUSE_SALT:-changeme-langfuse-salt-32chars}
      - TELEMETRY_ENABLED=false
      # Optional: Enable sign-up (disable in production)
      - ENABLE_EXPERIMENTAL_FEATURES=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=false
    networks:
      - nexusai-internal
      - nexusai-monitoring
    ports:
      - "3030:3000"
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.langfuse.rule: "Host(`langfuse.${DOMAIN:-localhost}`)"
      traefik.http.routers.langfuse.tls.certresolver: "letsencrypt"
      traefik.http.services.langfuse.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  # =============================================================================
  # Alertmanager
  # =============================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: nexusai-alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - nexusai-monitoring
    expose:
      - "9093"
    labels:
      traefik.enable: "true"
      traefik.http.routers.alertmanager.rule: "Host(`alerts.${DOMAIN:-localhost}`)"
      traefik.http.routers.alertmanager.tls.certresolver: "letsencrypt"
      traefik.http.routers.alertmanager.middlewares: "auth@file"
      traefik.http.services.alertmanager.loadbalancer.server.port: "9093"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging: *default-logging

# =============================================================================
# Monitoring Network
# =============================================================================
networks:
  nexusai-monitoring:
    name: nexusai-monitoring
    driver: bridge

# =============================================================================
# Monitoring Volumes
# =============================================================================
volumes:
  prometheus-data:
    name: nexusai-prometheus-data
  grafana-data:
    name: nexusai-grafana-data
  loki-data:
    name: nexusai-loki-data
  alertmanager-data:
    name: nexusai-alertmanager-data
  jaeger-data:
    name: nexusai-jaeger-data
