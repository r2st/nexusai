x-common-labels: &common-labels
  app.kubernetes.io/part-of: nexusai
  app.kubernetes.io/managed-by: docker-compose

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    labels: "service,environment"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # =============================================================================
  # Reverse Proxy - Traefik
  # =============================================================================
  traefik:
    image: traefik:v3.0
    container_name: nexusai-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../../deploy/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../../../deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik-certificates:/letsencrypt
    networks:
      - nexusai-public
      - nexusai-internal
    labels:
      <<: *common-labels
      traefik.enable: "true"
      traefik.http.routers.traefik-dashboard.rule: "Host(`traefik.${DOMAIN:-localhost}`)"
      traefik.http.routers.traefik-dashboard.service: "api@internal"
      traefik.http.routers.traefik-dashboard.middlewares: "auth@file"
      traefik.http.routers.traefik-dashboard.tls.certresolver: "letsencrypt"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging

  # =============================================================================
  # Backend API - FastAPI with Gunicorn/Uvicorn
  # =============================================================================
  backend:
    build:
      context: ../../../backend
      dockerfile: Dockerfile
      target: production
    image: nexusai/backend:${VERSION:-latest}
    container_name: nexusai-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexusai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WORKERS=${BACKEND_WORKERS:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - nexusai-internal
    expose:
      - "8000"
    labels:
      <<: *common-labels
      traefik.enable: "true"
      traefik.http.routers.backend.rule: "Host(`api.${DOMAIN:-localhost}`)"
      traefik.http.routers.backend.tls.certresolver: "letsencrypt"
      traefik.http.routers.backend.middlewares: "rate-limit@file,security-headers@file"
      traefik.http.services.backend.loadbalancer.server.port: "8000"
      traefik.http.services.backend.loadbalancer.healthcheck.path: "/health"
      traefik.http.services.backend.loadbalancer.healthcheck.interval: "10s"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

  # =============================================================================
  # ARQ Worker - Background Task Processing
  # =============================================================================
  worker:
    build:
      context: ../../../backend
      dockerfile: Dockerfile
      target: production
    image: nexusai/backend:${VERSION:-latest}
    container_name: nexusai-worker
    restart: unless-stopped
    command: ["python", "-m", "arq", "app.worker.WorkerSettings"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=200m
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nexusai}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nexusai-internal
    labels:
      <<: *common-labels
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import redis; r = redis.from_url('redis://:${REDIS_PASSWORD:-}@redis:6379/0'); r.ping()"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

  # =============================================================================
  # Frontend - Next.js
  # =============================================================================
  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile
      target: production
    image: nexusai/frontend:${VERSION:-latest}
    container_name: nexusai-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-localhost}
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend
    networks:
      - nexusai-internal
    expose:
      - "3000"
    labels:
      <<: *common-labels
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "Host(`${DOMAIN:-localhost}`)"
      traefik.http.routers.frontend.tls.certresolver: "letsencrypt"
      traefik.http.routers.frontend.middlewares: "security-headers@file"
      traefik.http.services.frontend.loadbalancer.server.port: "3000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging

  # =============================================================================
  # PostgreSQL with pgvector
  # =============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusai-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-nexusai}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../../deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - nexusai-internal
    expose:
      - "5432"
    labels:
      <<: *common-labels
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nexusai}"]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

  # =============================================================================
  # Redis
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 60
      --timeout 0
    volumes:
      - redis-data:/data
    networks:
      - nexusai-internal
    expose:
      - "6379"
    labels:
      <<: *common-labels
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging

  # =============================================================================
  # Meilisearch
  # =============================================================================
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: nexusai-meilisearch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY}
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_LOG_LEVEL=INFO
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - nexusai-internal
    expose:
      - "7700"
    labels:
      <<: *common-labels
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *default-logging

# =============================================================================
# Networks
# =============================================================================
networks:
  nexusai-public:
    name: nexusai-public
    driver: bridge
  nexusai-internal:
    name: nexusai-internal
    driver: bridge
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    name: nexusai-postgres-data
  redis-data:
    name: nexusai-redis-data
  meilisearch-data:
    name: nexusai-meilisearch-data
  traefik-certificates:
    name: nexusai-traefik-certificates
