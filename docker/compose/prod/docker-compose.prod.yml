# Production Docker Compose with horizontal scaling
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --scale backend=3

services:
  # ======================
  # Load Balancer (HAProxy/Nginx)
  # ======================

  nginx:
    image: nginx:alpine
    container_name: nexusai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../../docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ======================
  # Backend API (Scalable)
  # ======================

  backend:
    build:
      context: ../../../backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - DATABASE_HOST=pgbouncer
      - DATABASE_PORT=6432
      - DATABASE_USER=${DATABASE_USER:-nexusai}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-nexusai}
      - DATABASE_NAME=${DATABASE_NAME:-nexusai}
      - DATABASE_POOL_SIZE=5
      - DATABASE_MAX_OVERFLOW=10
      - DATABASE_USE_NULL_POOL=true
      - DATABASE_READ_REPLICA_URL=${DATABASE_READ_REPLICA_URL:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=false
      - WORKERS=4
      - DEVLAKE_API_URL=http://devlake:8080
      - OPENBAO_URL=http://openbao:8200
      - OPENBAO_TOKEN=${OPENBAO_TOKEN:-}
      - OPENFGA_URL=http://openfga:8080
      - OPENFGA_STORE_ID=${OPENFGA_STORE_ID:-}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=nexusai-backend
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - MULTI_TENANT_ENABLED=true
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      mode: replicated
      replicas: 3
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s

  # ======================
  # Background Worker (Scalable)
  # ======================

  worker:
    build:
      context: ../../../backend
      dockerfile: Dockerfile.prod
    command: arq app.core.tasks.WorkerSettings
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      - DATABASE_HOST=pgbouncer
      - DATABASE_PORT=6432
      - DATABASE_USER=${DATABASE_USER:-nexusai}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-nexusai}
      - DATABASE_NAME=${DATABASE_NAME:-nexusai}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - TASK_WORKER_CONCURRENCY=10
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import redis; r = redis.from_url('redis://redis:6379/0'); r.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ======================
  # PgBouncer Connection Pooler
  # ======================

  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    container_name: nexusai-pgbouncer
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${DATABASE_USER:-nexusai}:${DATABASE_PASSWORD:-nexusai}@postgres:5432/${DATABASE_NAME:-nexusai}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=50
      - MIN_POOL_SIZE=10
      - RESERVE_POOL_SIZE=25
      - SERVER_ROUND_ROBIN=1
      - LOG_CONNECTIONS=0
      - LOG_DISCONNECTIONS=0
      - LOG_POOLER_ERRORS=1
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ======================
  # PostgreSQL Primary
  # ======================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusai-postgres-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-nexusai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nexusai}
      POSTGRES_DB: ${DATABASE_NAME:-nexusai}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../../docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - ../../../docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-nexusai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

  # ======================
  # Redis Cluster (Sentinel for HA)
  # ======================

  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  # ======================
  # ClickHouse (Production)
  # ======================

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: nexusai-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-nexusai}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ../../../docker/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml
      - ../../../docker/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  clickhouse_data:
  clickhouse_logs:
  devlake_logs:
  grafana_data:
  openbao_data:
  jaeger_data:
  prometheus_data:

networks:
  default:
    name: nexusai-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
