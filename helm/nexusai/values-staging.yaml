# =============================================================================
# NexusAI Helm Chart - Staging Environment Values
# =============================================================================

# Global settings
global:
  imageRegistry: "ghcr.io/nexusai"

# Application configuration
config:
  appName: "NexusAI Staging"
  environment: "staging"
  debug: "false"
  logLevel: "info"
  enableMetrics: "true"
  enableTracing: "true"
  tenantIsolation: "true"

# Backend configuration
backend:
  enabled: true
  replicaCount: 2

  image:
    tag: "staging"
    pullPolicy: Always

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2

  image:
    tag: "staging"
    pullPolicy: Always

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Worker configuration
worker:
  enabled: true
  replicaCount: 2

  image:
    tag: "staging"
    pullPolicy: Always

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# Ingress configuration
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
  hosts:
    - host: staging.nexusai.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 3000
  tls:
    - secretName: nexusai-staging-tls
      hosts:
        - staging.nexusai.example.com

# Service account with Azure Workload Identity
serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: ""  # Set via --set

# Security contexts
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Network policy (enabled)
networkPolicy:
  enabled: true

# Service monitor
serviceMonitor:
  enabled: true
  interval: "30s"
  labels:
    release: prometheus

# Dependencies - use embedded services for staging
postgresql:
  enabled: true
  auth:
    username: nexusai
    existingSecret: nexusai-postgresql-secret
    database: nexusai_staging
  primary:
    persistence:
      size: 20Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

redis:
  enabled: true
  auth:
    existingSecret: nexusai-redis-secret
  master:
    persistence:
      size: 5Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

meilisearch:
  enabled: true
  environment:
    MEILI_ENV: production
  persistence:
    size: 10Gi
