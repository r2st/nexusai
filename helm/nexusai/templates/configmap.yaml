apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nexusai.fullname" . }}-config
  labels:
    {{- include "nexusai.labels" . | nindent 4 }}
data:
  # Application settings
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.environment | quote }}
  DEBUG: {{ .Values.config.debug | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  # Server settings
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"

  # Feature flags
  ENABLE_METRICS: {{ .Values.config.enableMetrics | quote }}
  ENABLE_TRACING: {{ .Values.config.enableTracing | quote }}

  # External service configuration
  {{- if .Values.config.openaiModel }}
  OPENAI_MODEL: {{ .Values.config.openaiModel | quote }}
  {{- end }}

  {{- if .Values.config.anthropicModel }}
  ANTHROPIC_MODEL: {{ .Values.config.anthropicModel | quote }}
  {{- end }}

  # Cache settings
  CACHE_TTL: {{ .Values.config.cacheTtl | default "3600" | quote }}

  # Rate limiting
  RATE_LIMIT_REQUESTS: {{ .Values.config.rateLimitRequests | default "100" | quote }}
  RATE_LIMIT_WINDOW: {{ .Values.config.rateLimitWindow | default "60" | quote }}

  # CORS settings
  {{- if .Values.config.corsOrigins }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  {{- end }}

  # Tenant settings
  TENANT_ISOLATION_ENABLED: {{ .Values.config.tenantIsolation | default "true" | quote }}

  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
