apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexusai.fullname" . }}-secret
  labels:
    {{- include "nexusai.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.secretKey }}
  SECRET_KEY: {{ .Values.secrets.secretKey | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.databasePassword }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.meilisearchApiKey }}
  MEILISEARCH_API_KEY: {{ .Values.secrets.meilisearchApiKey | b64enc | quote }}
  {{- end }}

  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- end }}

  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
