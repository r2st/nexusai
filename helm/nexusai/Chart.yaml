apiVersion: v2
name: nexusai
description: NexusAI - AI-powered chat and analytics platform
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - ai
  - chat
  - analytics
  - devops
  - metrics

home: https://github.com/your-org/nexusai
sources:
  - https://github.com/your-org/nexusai

maintainers:
  - name: Platform Team
    email: platform@example.com

dependencies:
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled

  - name: redis
    version: "18.6.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

  - name: meilisearch
    version: "0.5.0"
    repository: "https://meilisearch.github.io/meilisearch-kubernetes"
    condition: meilisearch.enabled
