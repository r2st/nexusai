# =============================================================================
# Prometheus Configuration
# =============================================================================
# Scrape configurations for NexusAI monitoring
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  # Attach labels to any time series or alerts
  external_labels:
    cluster: "nexusai-production"
    environment: "production"

# -----------------------------------------------------------------------------
# Alertmanager Configuration
# -----------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

# -----------------------------------------------------------------------------
# Rule Files
# -----------------------------------------------------------------------------
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording_rules.yml

# -----------------------------------------------------------------------------
# Scrape Configurations
# -----------------------------------------------------------------------------
scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # NexusAI Backend API
  # ---------------------------------------------------------------------------
  - job_name: "nexusai-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):\\d+"
        replacement: "$1"
      - target_label: service
        replacement: "backend"

  # ---------------------------------------------------------------------------
  # NexusAI Frontend (if exposing metrics)
  # ---------------------------------------------------------------------------
  - job_name: "nexusai-frontend"
    static_configs:
      - targets: ["frontend:3000"]
    metrics_path: /api/metrics
    scrape_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: "frontend"

  # ---------------------------------------------------------------------------
  # PostgreSQL Exporter
  # ---------------------------------------------------------------------------
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: "postgres"

  # ---------------------------------------------------------------------------
  # Redis Exporter
  # ---------------------------------------------------------------------------
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: "redis"

  # ---------------------------------------------------------------------------
  # Node Exporter (Host Metrics)
  # ---------------------------------------------------------------------------
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "([^:]+):\\d+"
        replacement: "$1"

  # ---------------------------------------------------------------------------
  # Traefik
  # ---------------------------------------------------------------------------
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]
    metrics_path: /metrics
    relabel_configs:
      - target_label: service
        replacement: "traefik"

  # ---------------------------------------------------------------------------
  # Meilisearch
  # ---------------------------------------------------------------------------
  - job_name: "meilisearch"
    static_configs:
      - targets: ["meilisearch:7700"]
    metrics_path: /metrics
    scrape_interval: 30s
    relabel_configs:
      - target_label: service
        replacement: "meilisearch"

  # ---------------------------------------------------------------------------
  # Docker containers (via cAdvisor if deployed)
  # ---------------------------------------------------------------------------
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics
    scrape_interval: 30s

