# =============================================================================
# Prometheus Alerting Rules for NexusAI
# =============================================================================

groups:
  # ---------------------------------------------------------------------------
  # Infrastructure Alerts
  # ---------------------------------------------------------------------------
  - name: infrastructure
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

      - alert: CriticalCPUUsage
        expr: |
          100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 95% (current: {{ $value | printf \"%.1f\" }}%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 80% (current: {{ $value | printf \"%.1f\" }}%)"

      - alert: CriticalMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95% (current: {{ $value | printf \"%.1f\" }}%)"

      # Disk space
      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 20% ({{ $value | printf \"%.1f\" }}% available)"

      - alert: CriticalDiskSpace
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 2m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk space is below 10% ({{ $value | printf \"%.1f\" }}% available)"

  # ---------------------------------------------------------------------------
  # Application Alerts
  # ---------------------------------------------------------------------------
  - name: application
    interval: 30s
    rules:
      # Service down
      - alert: ServiceDown
        expr: up{job=~"nexusai-.*"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "The service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute"

      # High error rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          /
          sum(rate(http_requests_total[5m])) by (service)
          * 100 > 5
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High error rate for {{ $labels.service }}"
          description: "Error rate is above 5% (current: {{ $value | printf \"%.2f\" }}%)"

      - alert: CriticalErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          /
          sum(rate(http_requests_total[5m])) by (service)
          * 100 > 10
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical error rate for {{ $labels.service }}"
          description: "Error rate is above 10% (current: {{ $value | printf \"%.2f\" }}%)"

      # High latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High latency for {{ $labels.service }}"
          description: "95th percentile latency is above 1s (current: {{ $value | printf \"%.2f\" }}s)"

      - alert: CriticalLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 5
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical latency for {{ $labels.service }}"
          description: "95th percentile latency is above 5s (current: {{ $value | printf \"%.2f\" }}s)"

  # ---------------------------------------------------------------------------
  # Database Alerts
  # ---------------------------------------------------------------------------
  - name: database
    interval: 30s
    rules:
      # PostgreSQL down
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
          team: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is not responding"

      # PostgreSQL high connections
      - alert: PostgreSQLHighConnections
        expr: |
          pg_stat_activity_count / pg_settings_max_connections * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "PostgreSQL high connection usage"
          description: "Connection usage is above 80% ({{ $value | printf \"%.1f\" }}%)"

      # PostgreSQL slow queries
      - alert: PostgreSQLSlowQueries
        expr: |
          rate(pg_stat_statements_seconds_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "PostgreSQL slow queries detected"
          description: "Slow query rate is elevated"

      # PostgreSQL replication lag (if using replication)
      - alert: PostgreSQLReplicationLag
        expr: |
          pg_replication_lag > 30
        for: 5m
        labels:
          severity: warning
          team: database
        annotations:
          summary: "PostgreSQL replication lag"
          description: "Replication lag is {{ $value }}s"

  # ---------------------------------------------------------------------------
  # Redis Alerts
  # ---------------------------------------------------------------------------
  - name: redis
    interval: 30s
    rules:
      # Redis down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is not responding"

      # Redis high memory usage
      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Redis high memory usage"
          description: "Redis memory usage is above 80% ({{ $value | printf \"%.1f\" }}%)"

      # Redis too many connections
      - alert: RedisTooManyConnections
        expr: redis_connected_clients > 1000
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Redis has too many connections"
          description: "Redis has {{ $value }} connected clients"

      # Redis rejected connections
      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Redis is rejecting connections"
          description: "Redis rejected {{ $value }} connections in the last hour"

  # ---------------------------------------------------------------------------
  # Worker Queue Alerts
  # ---------------------------------------------------------------------------
  - name: workers
    interval: 30s
    rules:
      # High queue depth
      - alert: HighQueueDepth
        expr: arq_queue_length > 1000
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High queue depth"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending jobs"

      - alert: CriticalQueueDepth
        expr: arq_queue_length > 5000
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Critical queue depth"
          description: "Queue {{ $labels.queue }} has {{ $value }} pending jobs"

      # Failed jobs
      - alert: HighJobFailureRate
        expr: |
          rate(arq_jobs_failed_total[5m]) / rate(arq_jobs_completed_total[5m]) * 100 > 5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High job failure rate"
          description: "Job failure rate is {{ $value | printf \"%.2f\" }}%"

  # ---------------------------------------------------------------------------
  # Traefik Alerts
  # ---------------------------------------------------------------------------
  - name: traefik
    interval: 30s
    rules:
      # Traefik down
      - alert: TraefikDown
        expr: up{job="traefik"} == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Traefik is down"
          description: "Traefik reverse proxy is not responding"

      # High 4xx rate
      - alert: TraefikHigh4xxRate
        expr: |
          sum(rate(traefik_entrypoint_requests_total{code=~"4.."}[5m]))
          /
          sum(rate(traefik_entrypoint_requests_total[5m]))
          * 100 > 10
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High 4xx error rate"
          description: "4xx error rate is above 10% ({{ $value | printf \"%.2f\" }}%)"

      # High 5xx rate
      - alert: TraefikHigh5xxRate
        expr: |
          sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[5m]))
          /
          sum(rate(traefik_entrypoint_requests_total[5m]))
          * 100 > 5
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High 5xx error rate at ingress"
          description: "5xx error rate is above 5% ({{ $value | printf \"%.2f\" }}%)"

  # ---------------------------------------------------------------------------
  # Certificate Alerts
  # ---------------------------------------------------------------------------
  - name: certificates
    interval: 1h
    rules:
      - alert: CertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "SSL certificate expiring soon"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | printf \"%.0f\" }} days"

      - alert: CertificateExpiryCritical
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 7
        for: 1h
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "SSL certificate expiring very soon"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | printf \"%.0f\" }} days"
