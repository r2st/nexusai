---
# =============================================================================
# NexusAI Secrets Template
# =============================================================================
# IMPORTANT: This is a TEMPLATE file. Do NOT commit actual secrets to git!
#
# For production, use one of these approaches:
# 1. External Secrets Operator with AWS Secrets Manager, HashiCorp Vault, etc.
# 2. Sealed Secrets (Bitnami)
# 3. SOPS with age/GPG encryption
# 4. Kubernetes native secrets with strict RBAC
#
# To create secrets from this template:
#   kubectl create secret generic nexusai-secrets \
#     --from-literal=SECRET_KEY=$(openssl rand -base64 32) \
#     --from-literal=DATABASE_PASSWORD=$(openssl rand -base64 24) \
#     --from-literal=REDIS_PASSWORD=$(openssl rand -base64 24) \
#     --from-literal=MEILISEARCH_API_KEY=$(openssl rand -base64 32) \
#     -n nexusai
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: nexusai-secrets
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/part-of: nexusai
  annotations:
    # Indicate this is a template
    nexusai.io/template: "true"
    # External secrets operator annotations (example)
    # external-secrets.io/provider: aws-secrets-manager
    # external-secrets.io/secret-path: nexusai/production
type: Opaque
stringData:
  # Application secrets
  SECRET_KEY: "<REPLACE_WITH_SECURE_SECRET_KEY>"

  # Database credentials
  DATABASE_USER: "nexusai"
  DATABASE_PASSWORD: "<REPLACE_WITH_SECURE_PASSWORD>"
  DATABASE_URL: "postgresql+asyncpg://nexusai:<PASSWORD>@postgres:5432/nexusai"

  # Redis credentials
  REDIS_PASSWORD: "<REPLACE_WITH_SECURE_PASSWORD>"
  REDIS_URL: "redis://:<PASSWORD>@redis:6379/0"

  # Meilisearch API key
  MEILISEARCH_API_KEY: "<REPLACE_WITH_SECURE_API_KEY>"

  # JWT settings
  JWT_SECRET_KEY: "<REPLACE_WITH_SECURE_JWT_SECRET>"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION: "3600"

  # OAuth credentials (if used)
  # GOOGLE_CLIENT_ID: "<YOUR_GOOGLE_CLIENT_ID>"
  # GOOGLE_CLIENT_SECRET: "<YOUR_GOOGLE_CLIENT_SECRET>"
  # GITHUB_CLIENT_ID: "<YOUR_GITHUB_CLIENT_ID>"
  # GITHUB_CLIENT_SECRET: "<YOUR_GITHUB_CLIENT_SECRET>"

  # AI Provider API keys (if used)
  # OPENAI_API_KEY: "<YOUR_OPENAI_API_KEY>"
  # ANTHROPIC_API_KEY: "<YOUR_ANTHROPIC_API_KEY>"

---
# =============================================================================
# PostgreSQL Secrets
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: "nexusai"
  POSTGRES_PASSWORD: "<REPLACE_WITH_SECURE_PASSWORD>"

---
# =============================================================================
# Redis Secrets
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: redis
type: Opaque
stringData:
  REDIS_PASSWORD: "<REPLACE_WITH_SECURE_PASSWORD>"

---
# =============================================================================
# Docker Registry Secret (for private images)
# =============================================================================
# Create with:
#   kubectl create secret docker-registry nexusai-registry \
#     --docker-server=<REGISTRY_URL> \
#     --docker-username=<USERNAME> \
#     --docker-password=<PASSWORD> \
#     --docker-email=<EMAIL> \
#     -n nexusai
apiVersion: v1
kind: Secret
metadata:
  name: nexusai-registry
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6e319  # Base64 encoded empty auth - replace with actual

---
