---
# =============================================================================
# NexusAI Backend Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexusai
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  sessionAffinity: None

---
# =============================================================================
# NexusAI Frontend Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nexusai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  sessionAffinity: None

---
# =============================================================================
# PostgreSQL Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: nexusai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  sessionAffinity: None

---
# =============================================================================
# Redis Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: nexusai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  sessionAffinity: None

---
# =============================================================================
# Meilisearch Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: meilisearch
    app.kubernetes.io/part-of: nexusai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: 7700
      protocol: TCP
  sessionAffinity: None

---
# =============================================================================
# Backend Headless Service (for StatefulSet if needed)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend-headless
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexusai
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
