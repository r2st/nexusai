  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: nexusai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusai
      app.kubernetes.io/component: frontend

---
