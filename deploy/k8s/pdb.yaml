---
# =============================================================================
# NexusAI Backend Pod Disruption Budget
# =============================================================================
# Ensures high availability during voluntary disruptions
# (node maintenance, cluster upgrades, etc.)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: nexusai
  labels:
    app.kubernetes.io/name: nexusai
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexusai
spec:
  # At least 2 pods must be available at all times
  minAvailable: 2
  # Alternative: Allow at most 1 pod to be unavailable
  # maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexusai
      app.kubernetes.io/component: backend

---
# =============================================================================
# NexusAI Frontend Pod Disruption Budget
# =============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
