# =============================================================================
# Promtail Configuration
# =============================================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: nexusai

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      # Parse Docker JSON logs
      - json:
          expressions:
            log: log
            stream: stream
            time: time
            attrs: attrs

      # Extract container info from labels
      - labels:
          stream:

      # Parse the actual log message
      - output:
          source: log

      # Drop empty logs
      - drop:
          expression: "^\\s*$"

  # NexusAI Backend logs
  - job_name: nexusai-backend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["app.kubernetes.io/component=backend"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - action: replace
        replacement: nexusai-backend
        target_label: 'job'

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            request_id: request_id
            user_id: user_id
      - labels:
          level:
          request_id:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

  # NexusAI Frontend logs
  - job_name: nexusai-frontend
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["app.kubernetes.io/component=frontend"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - action: replace
        replacement: nexusai-frontend
        target_label: 'job'

  # Worker logs
  - job_name: nexusai-worker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["app.kubernetes.io/component=worker"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - action: replace
        replacement: nexusai-worker
        target_label: 'job'

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            task_name: task_name
            task_id: task_id
      - labels:
          level:
          task_name:
