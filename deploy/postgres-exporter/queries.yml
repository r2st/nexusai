# =============================================================================
# PostgreSQL Exporter Custom Queries
# =============================================================================

# Database size
pg_database:
  query: |
    SELECT pg_database.datname, pg_database_size(pg_database.datname) as size_bytes
    FROM pg_database
    WHERE datname NOT IN ('template0', 'template1')
  master: true
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - size_bytes:
        usage: "GAUGE"
        description: "Database size in bytes"

# Table sizes
pg_table_sizes:
  query: |
    SELECT
      schemaname,
      relname,
      pg_total_relation_size(relid) as total_bytes,
      pg_relation_size(relid) as table_bytes,
      pg_indexes_size(relid) as index_bytes
    FROM pg_catalog.pg_statio_user_tables
  master: true
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "Schema name"
    - relname:
        usage: "LABEL"
        description: "Table name"
    - total_bytes:
        usage: "GAUGE"
        description: "Total relation size in bytes"
    - table_bytes:
        usage: "GAUGE"
        description: "Table size in bytes"
    - index_bytes:
        usage: "GAUGE"
        description: "Index size in bytes"

# Slow queries
pg_stat_statements:
  query: |
    SELECT
      queryid,
      calls,
      total_exec_time / 1000 as total_time_seconds,
      mean_exec_time / 1000 as mean_time_seconds,
      rows
    FROM pg_stat_statements
    WHERE query NOT LIKE '%pg_stat_statements%'
    ORDER BY total_exec_time DESC
    LIMIT 100
  master: true
  metrics:
    - queryid:
        usage: "LABEL"
        description: "Query ID"
    - calls:
        usage: "COUNTER"
        description: "Number of times executed"
    - total_time_seconds:
        usage: "COUNTER"
        description: "Total time spent in seconds"
    - mean_time_seconds:
        usage: "GAUGE"
        description: "Mean time per execution in seconds"
    - rows:
        usage: "COUNTER"
        description: "Total rows returned"

# Replication lag
pg_replication:
  query: |
    SELECT
      CASE
        WHEN NOT pg_is_in_recovery() THEN 0
        ELSE GREATEST (0, EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())))
      END AS lag_seconds
  master: true
  metrics:
    - lag_seconds:
        usage: "GAUGE"
        description: "Replication lag in seconds"

# Connection stats
pg_connections:
  query: |
    SELECT
      datname,
      usename,
      state,
      count(*) as count
    FROM pg_stat_activity
    WHERE datname IS NOT NULL
    GROUP BY datname, usename, state
  master: true
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - usename:
        usage: "LABEL"
        description: "User name"
    - state:
        usage: "LABEL"
        description: "Connection state"
    - count:
        usage: "GAUGE"
        description: "Number of connections"

# Lock statistics
pg_locks:
  query: |
    SELECT
      pg_database.datname,
      mode,
      count(*) as count
    FROM pg_locks
    JOIN pg_database ON pg_locks.database = pg_database.oid
    WHERE pg_database.datname NOT IN ('template0', 'template1')
    GROUP BY pg_database.datname, mode
  master: true
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - mode:
        usage: "LABEL"
        description: "Lock mode"
    - count:
        usage: "GAUGE"
        description: "Number of locks"

# Cache hit ratio
pg_cache_hit_ratio:
  query: |
    SELECT
      datname,
      CASE
        WHEN (blks_hit + blks_read) > 0
        THEN blks_hit::float / (blks_hit + blks_read)
        ELSE 0
      END as ratio
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1')
  master: true
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - ratio:
        usage: "GAUGE"
        description: "Cache hit ratio"

# Transaction stats
pg_transactions:
  query: |
    SELECT
      datname,
      xact_commit as commits,
      xact_rollback as rollbacks,
      deadlocks
    FROM pg_stat_database
    WHERE datname NOT IN ('template0', 'template1')
  master: true
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - commits:
        usage: "COUNTER"
        description: "Number of commits"
    - rollbacks:
        usage: "COUNTER"
        description: "Number of rollbacks"
    - deadlocks:
        usage: "COUNTER"
        description: "Number of deadlocks"

# Index usage
pg_index_usage:
  query: |
    SELECT
      schemaname,
      relname,
      indexrelname,
      idx_scan,
      idx_tup_read,
      idx_tup_fetch
    FROM pg_stat_user_indexes
  master: true
  metrics:
    - schemaname:
        usage: "LABEL"
        description: "Schema name"
    - relname:
        usage: "LABEL"
        description: "Table name"
    - indexrelname:
        usage: "LABEL"
        description: "Index name"
    - idx_scan:
        usage: "COUNTER"
        description: "Number of index scans"
    - idx_tup_read:
        usage: "COUNTER"
        description: "Number of tuples read"
    - idx_tup_fetch:
        usage: "COUNTER"
        description: "Number of tuples fetched"
